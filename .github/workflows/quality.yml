name: JoshHack Quality Checks

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read          # checkout
  security-events: write  # required by upload-sarif
  actions: read           # required by upload-sarif on private repos

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run JUnit regression tests
        run: ./mvnw test

      # Add PIT mutation testing later

      - name: Run PIT mutation testing
        run: ./mvnw test-compile org.pitest:pitest-maven:mutationCoverage


      # Add PIT report artifact upload later

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-report
          path: target/pit-reports/

      - name: Run SpotBugs static analysis
        run: ./mvnw compile spotbugs:spotbugs

      - name: Upload SpotBugs SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/spotbugsSarif.json
          category: spotbugs